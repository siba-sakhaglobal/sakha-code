[workspace]
resolver = "2"
members = [
    "crates/sakha-core",
    "crates/sakha-provider",
    "crates/sakha-context",
    "crates/sakha-compression",
    "crates/sakha-memory",
    "crates/sakha-tools",
    "crates/sakha-security",
    "crates/sakha-research",
    "crates/sakha-mcp",
    "crates/sakha-observability",
    "crates/sakha-agent",
    "crates/sakha-loop",
    "crates/sakha-daemon",
    "crates/sakha-cli",
    "crates/sakha-tui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/sakha-agent/sakha"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
ratatui = "0.28"
crossterm = "0.28"
axum = { version = "0.7", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tempfile = "3"
rand = "0.8"
dirs = "5"
toml = "0.8"
regex = "1"
walkdir = "2"
similar = "2"
url = "2"
html2text = "0.12"
tokio-util = "0.7"
keyring = "3"
webbrowser = "1"
sha2 = "0.10"
base64 = "0.22"
rpassword = "7"
dotenvy = "0.15"

# Internal crates
sakha-core = { path = "crates/sakha-core" }
sakha-provider = { path = "crates/sakha-provider" }
sakha-context = { path = "crates/sakha-context" }
sakha-compression = { path = "crates/sakha-compression" }
sakha-memory = { path = "crates/sakha-memory" }
sakha-tools = { path = "crates/sakha-tools" }
sakha-security = { path = "crates/sakha-security" }
sakha-research = { path = "crates/sakha-research" }
sakha-mcp = { path = "crates/sakha-mcp" }
sakha-observability = { path = "crates/sakha-observability" }
sakha-agent = { path = "crates/sakha-agent" }
sakha-loop = { path = "crates/sakha-loop" }
